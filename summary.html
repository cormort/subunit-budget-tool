<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>非營業基金收支數字提取與彙總 V39.0</title>
<style>
:root{--p:#1d4ed8;--s:#047857;--w:#b45309;--d:#b91c1c;--b:#dbe3ef;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef2f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}main{max-width:1600px;margin:auto}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px #0f172a12}h1{color:var(--p);margin:0 0 7px}h2{margin:0 0 12px}.sub{color:#64748b;margin:0 0 15px}.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.type-card{border:2px solid #cbd5e1;border-radius:11px;padding:13px;cursor:pointer}.type-card:has(input:checked){border-color:var(--p);background:#eff6ff}.drop{margin-top:14px;padding:28px;text-align:center;border:2px dashed #93b4ea;border-radius:12px;background:#f8fbff;cursor:pointer}.drop.over{background:#eff6ff;border-color:var(--p)}input[type=file]{display:none}.btn{border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;background:#fff;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff;border-color:var(--p)}.danger{color:var(--d)}.toolbar,.tabs,.statusline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between}.tabs{border-bottom:2px solid #e2e8f0;margin:14px 0}.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:var(--p);border-color:var(--p);font-weight:800}.pane{display:none}.pane.active{display:block}.tablewrap{overflow:auto;max-height:65vh;border:1px solid var(--b);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{border:1px solid var(--b);padding:9px;text-align:right;vertical-align:top}th{position:sticky;top:0;background:#e9eef6;z-index:1}th:first-child,td:first-child{text-align:left}.total{background:#dbeafe;font-weight:800}.ok{color:var(--s)}.warn{color:var(--w)}.bad{color:var(--d)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#f1f5f9;font-size:.8rem}.log{white-space:pre-wrap;max-height:360px;overflow:auto;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px}.moneyzh{display:block;font-size:.78rem;color:#64748b}.empty{text-align:center!important;color:#64748b}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;flex:1;min-width:140px}.progress>i{display:block;height:100%;width:0;background:var(--p);transition:.2s}@media(max-width:700px){body{padding:9px}.type-grid{grid-template-columns:1fr}.card{padding:13px}}
</style></head><body><main><section class="card"><h1>非營業基金收支數字提取與彙總</h1><p class="sub">批次匯入 DOCX，自動提取作業基金或政事基金金額，提供品質檢查、勾稽、刪除及 Excel 匯出。</p>
<div class="type-grid"><label class="type-card"><input type="radio" name="stype" value="operating" checked> <strong>作業基金</strong><br><small>收入、成本費用、業務外收支及本期賸餘（短絀）</small></label><label class="type-card"><input type="radio" name="stype" value="governmental"> <strong>政事基金</strong><br><small>基金來源、用途、賸餘（短絀）、公庫及基金餘額</small></label></div>
<input id="files" type="file" multiple accept=".docx"><div class="drop" id="drop"><strong>拖曳或點選多個 DOCX</strong><div class="sub" style="margin:4px 0">自動排除重複檔案，並逐檔顯示提取品質</div></div><div class="statusline"><span id="status">尚未匯入</span><div class="progress"><i id="bar"></i></div></div></section>
<section class="card"><div class="toolbar"><h2>彙總結果</h2><div><button class="btn primary" id="excel">匯出 Excel</button> <button class="btn" id="json">匯出 JSON</button> <button class="btn danger" id="clear">清除全部</button></div></div>
<nav class="tabs"><button class="tab active" data-pane="op">作業基金</button><button class="tab" data-pane="gov">政事基金</button><button class="tab" data-pane="quality">品質檢查</button><button class="tab" data-pane="logs">匯入紀錄</button></nav>
<div class="pane active" id="op"></div><div class="pane" id="gov"></div><div class="pane" id="quality"></div><div class="pane" id="logs"><div class="log" id="log">尚無紀錄</div></div></section></main>
<script src="assets/vendor/mammoth.browser.min.js"></script><script src="assets/vendor/xlsx.full.min.js"></script><script>
'use strict';const $=x=>document.getElementById(x),state={op:[],gov:[],seen:new Set(),logs:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(m,k=''){state.logs.unshift(`${new Date().toLocaleTimeString('zh-TW')} ${m}`);$('log').textContent=state.logs.join('\n')||'尚無紀錄'}
function fmt(n){return Number.isFinite(n)?Math.round(n).toLocaleString('zh-TW'):'未識別'}function zh(n){if(!Number.isFinite(n))return '未識別';const neg=n<0;let a=Math.round(Math.abs(n)),r=[];const y=Math.floor(a/1e8);a%=1e8;const w=Math.floor(a/1e4);a%=1e4;if(y)r.push(y.toLocaleString()+'億');if(w)r.push(w.toLocaleString()+'萬');if(a||!r.length)r.push(a.toLocaleString());return(neg?'負':'')+r.join('')+'元'}
function money(s){if(!s)return NaN;let x=String(s).replace(/[，,\s]/g,'').replace(/[圓]/g,'元'),neg=/短絀|負數|^\(|-$/.test(x);x=x.replace(/[()]/g,'');let total=0,hit=false;for(const [u,v] of [['億',1e8],['萬',1e4],['千',1e3],['仟',1e3]]){const m=x.match(new RegExp('([\\d.]+)'+u));if(m){total+=Number(m[1])*v;hit=true;x=x.replace(m[0],'')}}const tail=x.match(/[\d.]+/g);if(tail?.length){total+=Number(tail.at(-1));hit=true}return hit?(neg?-Math.abs(total):total):NaN}
const amt='((?:短絀)?\\s*[（(]?[\\d,，.]+(?:億[\\d,，.]*)?(?:萬[\\d,，.]*)?(?:千|仟)?[\\d,，.]*元?[）)]?)';
function find(text,labels){for(const l of labels){const re=new RegExp(l+'(?:合計|計)?[：:]?\\s*'+amt);const m=text.replace(/\u3000/g,' ').match(re);if(m)return money(m[1])}return NaN}
function fundName(text,file){const lines=text.split(/\r?\n/).map(x=>x.replace(/\s/g,'').trim()).filter(Boolean);return lines.find(x=>x.length<=60&&/基金/.test(x)&&!/(預算|分析說明|附屬單位)/.test(x))||file.replace(/\.docx$/i,'')}
function quality(row,fields){const missing=fields.filter(f=>!Number.isFinite(row[f]));let issues=[...missing.map(f=>'未識別：'+f)];if(row.kind==='作業基金'&&Number.isFinite(row.totalIncome)&&Number.isFinite(row.totalExpense)&&Number.isFinite(row.surplus)){const diff=row.totalIncome-row.totalExpense-row.surplus;if(Math.abs(diff)>1)issues.push('收支差額與賸餘短絀不符：'+fmt(diff))}if(row.kind==='政事基金'&&Number.isFinite(row.source)&&Number.isFinite(row.use)&&Number.isFinite(row.surplus)){const diff=row.source-row.use-row.surplus;if(Math.abs(diff)>1)issues.push('來源減用途與賸餘短絀不符：'+fmt(diff))}row.issues=issues;row.score=Math.max(0,100-Math.round(missing.length/fields.length*100)-(issues.length-missing.length)*15);return row}
function parse(text,file,type){const rawText=text;const compact=text.replace(/\s+/g,'');text=compact;if(type==='operating'){let r={id:crypto.randomUUID(),kind:'作業基金',fundName:fundName(rawText,file),fileName:file};r.income=find(text,['業務收入']);r.nonBizIncome=find(text,['業務外收入']);r.cost=find(text,['業務成本與費用','業務成本']);r.nonBizExpense=find(text,['業務外費用']);r.totalIncome=[r.income,r.nonBizIncome].every(Number.isFinite)?r.income+r.nonBizIncome:find(text,['業務總收入']);r.totalExpense=[r.cost,r.nonBizExpense].every(Number.isFinite)?r.cost+r.nonBizExpense:find(text,['業務總支出']);r.surplus=find(text,['本期賸餘\\(短絀\\)','本期賸餘','本期短絀']);if(/本期短絀/.test(text)&&Number.isFinite(r.surplus))r.surplus=-Math.abs(r.surplus);if(!Number.isFinite(r.surplus)&&Number.isFinite(r.totalIncome)&&Number.isFinite(r.totalExpense))r.surplus=r.totalIncome-r.totalExpense;return quality(r,['income','nonBizIncome','cost','nonBizExpense','surplus'])}let r={id:crypto.randomUUID(),kind:'政事基金',fundName:fundName(rawText,file),fileName:file};r.source=find(text,['本年度基金來源','基金來源']);r.use=find(text,['本年度基金用途','基金用途']);r.surplus=find(text,['本期賸餘\\(短絀\\)','相抵後，?賸餘','相抵後，?短絀']);if(/相抵後，?短絀/.test(text)&&Number.isFinite(r.surplus))r.surplus=-Math.abs(r.surplus);r.treasury=find(text,['解繳公庫']);r.initial=find(text,['以前年度基金餘額','期初基金餘額']);r.final=find(text,['期末基金餘額','共有基金餘額','尚餘']);if(!Number.isFinite(r.surplus)&&Number.isFinite(r.source)&&Number.isFinite(r.use))r.surplus=r.source-r.use;return quality(r,['source','use','surplus','treasury','initial','final'])}
async function ingest(list){const files=[...list],type=document.querySelector('[name=stype]:checked').value,valid=files.filter(f=>/\.docx$/i.test(f.name));if(!valid.length)return alert('請選擇 DOCX 檔案');let done=0;$('status').textContent=`處理 0 / ${valid.length}`;for(const f of valid){const sig=[f.name,f.size,f.lastModified,type].join('|');if(state.seen.has(sig)){log('略過重複：'+f.name);done++;continue}try{const res=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}),row=parse(res.value,f.name,type);(type==='operating'?state.op:state.gov).push(row);state.seen.add(sig);log(`完成：${f.name}，品質 ${row.score} 分`)}catch(e){log(`失敗：${f.name}：${e.message}`)}done++;$('bar').style.width=(done/valid.length*100)+'%';$('status').textContent=`處理 ${done} / ${valid.length}`}render();setTimeout(()=>$('bar').style.width='0',800)}
function sum(rows,k){const v=rows.map(r=>r[k]).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0):NaN}function cell(v,total=false){return Number.isFinite(v)?`${fmt(v)}${total?`<span class="moneyzh">${zh(v)}</span>`:''}`:'<span class="bad">未識別</span>'}
function table(rows,type){if(!rows.length)return '<p class="empty">尚無資料</p>';const op=type==='op',cols=op?[['income','業務收入'],['nonBizIncome','業務外收入'],['totalIncome','業務總收入'],['cost','業務成本與費用'],['nonBizExpense','業務外費用'],['totalExpense','業務總支出'],['surplus','本期賸餘（短絀）']]:[['source','基金來源'],['use','基金用途'],['surplus','本期賸餘（短絀）'],['treasury','解繳公庫'],['initial','期初基金餘額'],['final','期末基金餘額']];let h='<div class="tablewrap"><table><thead><tr><th>基金名稱／檔名</th>'+cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>品質</th><th>操作</th></tr></thead><tbody><tr class="total"><td>合計</td>'+cols.map(x=>`<td>${cell(sum(rows,x[0]),true)}</td>`).join('')+'<td></td><td></td></tr>';for(const r of rows)h+=`<tr><td>${esc(r.fundName)}<span class="moneyzh">${esc(r.fileName)}</span></td>${cols.map(x=>`<td>${cell(r[x[0]])}</td>`).join('')}<td><span class="badge ${r.score>=80?'ok':r.score>=50?'warn':'bad'}">${r.score} 分</span></td><td><button class="btn danger del" data-id="${r.id}">刪除</button></td></tr>`;return h+'</tbody></table></div>'}
function render(){state.op.sort((a,b)=>a.fileName.localeCompare(b.fileName,'zh-TW',{numeric:true}));state.gov.sort((a,b)=>a.fileName.localeCompare(b.fileName,'zh-TW',{numeric:true}));$('op').innerHTML=table(state.op,'op');$('gov').innerHTML=table(state.gov,'gov');const all=[...state.op,...state.gov];$('quality').innerHTML=all.length?'<div class="tablewrap"><table><thead><tr><th>檔案</th><th>類型</th><th>品質</th><th>檢查結果</th></tr></thead><tbody>'+all.map(r=>`<tr><td>${esc(r.fileName)}</td><td>${r.kind}</td><td>${r.score} 分</td><td class="${r.issues.length?'warn':'ok'}">${r.issues.length?r.issues.map(esc).join('<br>'):'通過基本勾稽'}</td></tr>`).join('')+'</tbody></table></div>':'<p class="empty">尚無資料</p>';document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{state.op=state.op.filter(x=>x.id!==b.dataset.id);state.gov=state.gov.filter(x=>x.id!==b.dataset.id);render()})}
function exportRows(){return [...state.op,...state.gov].map(r=>({...r,issues:r.issues.join('；')}))}function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
$('excel').onclick=()=>{const rows=exportRows();if(!rows.length)return alert('尚無資料');const wb=XLSX.utils.book_new();if(state.op.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.op.map(({id,issues,...r})=>({...r,issues:issues.join('；')}))),'作業基金');if(state.gov.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.gov.map(({id,issues,...r})=>({...r,issues:issues.join('；')}))),'政事基金');XLSX.writeFile(wb,'基金收支數字彙總.xlsx')};$('json').onclick=()=>{const r=exportRows();if(r.length)download(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),'基金收支數字彙總.json')};$('clear').onclick=()=>{if(confirm('確定清除全部彙總資料？')){state.op=[];state.gov=[];state.seen.clear();state.logs=[];$('log').textContent='尚無紀錄';render()}};
$('drop').onclick=()=>$('files').click();$('files').onchange=e=>{ingest(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(n=>$('drop').addEventListener(n,e=>{e.preventDefault();$('drop').classList.add('over')}));['dragleave','drop'].forEach(n=>$('drop').addEventListener(n,e=>{e.preventDefault();$('drop').classList.remove('over')}));$('drop').ondrop=e=>ingest(e.dataTransfer.files);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.pane).classList.add('active')});render();
</script></body></html>
