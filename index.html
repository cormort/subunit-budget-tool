<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基金資料整合工具 V39.0</title>
<style>
:root{--p:#1d4ed8;--b:#dbe3ef;--bg:#eef2f7;--text:#172033}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}.app-head{background:#fff;border-bottom:1px solid var(--b);padding:14px 20px 0;box-shadow:0 3px 12px #0f172a12;z-index:2}.title-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.title-row h1{font-size:clamp(1.25rem,2vw,1.9rem);margin:0;color:var(--p)}.offline{font-size:.82rem;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}.tabs{display:flex;gap:6px;margin-top:12px;overflow:auto}.tab{border:0;background:transparent;padding:11px 17px;border-bottom:3px solid transparent;white-space:nowrap;font-size:1rem;cursor:pointer;color:#475569}.tab.active{color:var(--p);border-color:var(--p);font-weight:800;background:#eff6ff;border-radius:9px 9px 0 0}.workspace{flex:1;min-height:0;padding:12px}.pane{display:none;width:100%;height:100%;border:1px solid var(--b);border-radius:12px;background:#fff;box-shadow:0 7px 22px #0f172a12}.pane.active{display:block}.hint{font-size:.8rem;color:#64748b}@media(max-width:700px){.app-head{padding:10px 10px 0}.title-row{align-items:flex-start}.offline{display:none}.workspace{padding:6px}.tab{padding:10px 12px;font-size:.92rem}}
</style></head><body>
<header class="app-head"><div class="title-row"><div><h1>基金資料整合工具 <small style="font-size:.55em;color:#64748b">V39.0</small></h1><div class="hint">資料庫查詢、收支數字彙總及作業基金分析說明</div></div><span class="offline">無 CDN 離線版</span></div>
<nav class="tabs" role="tablist"><button class="tab active" data-src="database.html">基金資料庫</button><button class="tab" data-src="summary.html">收支數字提取與彙總</button><button class="tab" data-src="generator.html">作業基金分析說明產生器</button><button class="tab" data-src="guide.html">操作說明與測試</button></nav></header>
<main class="workspace"><iframe class="pane active" title="基金資料庫" src="database.html"></iframe><iframe class="pane" title="收支數字提取與彙總" data-src="summary.html"></iframe><iframe class="pane" title="作業基金分析說明產生器" data-src="generator.html"></iframe><iframe class="pane" title="操作說明與測試" data-src="guide.html"></iframe></main>
<script>const tabs=[...document.querySelectorAll('.tab')],panes=[...document.querySelectorAll('.pane')];tabs.forEach((b,i)=>b.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));panes.forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=panes[i];if(!p.src&&p.dataset.src)p.src=p.dataset.src;p.classList.add('active');try{localStorage.setItem('fundToolMainTab',String(i))}catch{}}));try{const i=Number(localStorage.getItem('fundToolMainTab'));if(i>0&&tabs[i])tabs[i].click()}catch{}</script></body></html>
