<style>

*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1800px;margin:auto;background:linear-gradient(#f8fafc,#eef2f7);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.55}h1{margin:0 0 20px;color:var(--p);font-size:clamp(1.55rem,2.4vw,2.25rem)}h2,h3{margin-top:0}.main{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:24px;align-items:start;transition:.25s}.panel{background:var(--card);padding:22px;border:1px solid rgba(148,163,184,.3);border-radius:var(--r);box-shadow:var(--sh)}.side{position:sticky;top:18px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between}.head h2{margin:0 0 16px}.collapse{min-height:36px;padding:7px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;font-weight:700;cursor:pointer}.main.closed{grid-template-columns:78px minmax(0,1fr)}.main.closed .side{padding:14px 10px}.main.closed .side-body,.main.closed .head h2{display:none}.main.closed .head{flex-direction:column}.main.closed .collapse{writing-mode:vertical-rl;min-height:100px}.drop{padding:32px 16px;text-align:center;border:2px dashed #93b4ea;border-radius:12px;background:#f8fbff;cursor:pointer}.drop.over,.drop:hover{background:var(--ps);border-color:var(--p)}.drop-icon{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 10px;border-radius:50%;background:#dbeafe;color:var(--p);font-size:1.5rem;font-weight:800}.hint{font-size:.88rem;color:var(--m)}input[type=file]{display:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.span2{grid-column:1/-1}.btn{min-height:40px;padding:8px 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.primary{background:var(--p);border-color:var(--p);color:white}.success{background:var(--s);border-color:var(--s);color:white}.secondary{background:#475569;border-color:#475569;color:white}.summary,.quality{margin-top:12px;padding:11px;border:1px solid var(--b);border-radius:10px;background:#f8fafc;color:#475569;font-size:.9rem}.files{max-height:28vh;overflow:auto;margin-top:9px}.file{padding:7px 9px;margin:5px 0;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;font-size:.88rem;overflow-wrap:anywhere}.loader{display:none;text-align:center;color:var(--m);margin:14px}.spinner{width:26px;height:26px;margin:auto;border:3px solid #dbeafe;border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.batch{display:none;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:20px;padding:18px;border:1px solid #bfdbfe;border-radius:12px;background:linear-gradient(135deg,#eff6ff,#f8fafc)}.batch-head,.note{flex:1 1 100%}.batch-head{display:flex;justify-content:space-between;gap:12px}.batch-head h3{margin:0;color:#1e3a8a}.batch-head p,.note{margin:3px 0 0;color:var(--m);font-size:.88rem}.badge{padding:4px 9px;border-radius:999px;background:#dbeafe;color:var(--p);font-size:.78rem;font-weight:700;height:max-content}.group{flex:1 1 170px}label{display:block;margin-bottom:4px;font-size:.9rem;font-weight:700}select,input[type=text]{width:100%;height:40px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:7px;background:white;font-size:.96rem}.tabs{display:flex;gap:7px;border-bottom:2px solid #e2e8f0;margin-bottom:18px}.tab{padding:11px 18px;border:0;border-bottom:3px solid transparent;background:none;font-size:1rem;cursor:pointer}.tab.active{color:var(--p);border-color:var(--p);font-weight:700}.tab-pane{display:none}.tab-pane.active{display:block}.toolbar,.section-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:14px}.toolbar h3,.section-head h3{margin:0}.sub{margin:3px 0;color:var(--m);font-size:.88rem}.preview-select{min-width:min(480px,48%)}pre.preview{white-space:pre-wrap;max-height:68vh;overflow:auto;padding:15px;border:1px solid var(--b);border-radius:8px;background:#f8fafc;line-height:1.72;font-family:"SFMono-Regular",Consolas,monospace}.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}.row{display:flex;gap:12px;align-items:flex-end}.fg{flex:1}.keyword-row .small{flex:0 1 32%;min-width:220px}.keyword-row .wide{flex:1 1 68%}.keyword{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px}.result-info{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--m);font-size:.88rem;margin:8px 0}.table-wrap{overflow:auto;max-height:68vh;border:1px solid var(--b);border-radius:9px}table{width:100%;min-width:1100px;border-collapse:separate;border-spacing:0;table-layout:fixed}th,td{padding:10px;border-right:1px solid var(--b);border-bottom:1px solid var(--b);vertical-align:top;text-align:center;word-break:break-word}th{position:sticky;top:0;z-index:2;background:#e9eef6}td pre{margin:0;white-space:pre-wrap;text-align:left;font:inherit}.highlight{background:#fde68a;color:#b91c1c;font-weight:700}.resize{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize}.toast{position:fixed;right:24px;bottom:24px;z-index:99;max-width:440px;padding:13px 17px;border-radius:10px;background:#0f172a;color:#fff;box-shadow:0 12px 35px #0004;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{background:#991b1b}.warn{color:#b45309}.ok{color:var(--s)}
@media(max-width:980px){body{padding:12px}.main,.main.closed{grid-template-columns:1fr}.side{position:static}.main.closed .side{padding:14px}.main.closed .head{flex-direction:row}.main.closed .head h2{display:block}.main.closed .collapse{writing-mode:horizontal-tb;min-height:36px}.row,.toolbar,.section-head,.batch-head{flex-direction:column;align-items:stretch}.keyword-row .small,.keyword-row .wide,.preview-select{min-width:0;width:100%}}

<body>
<h1>基金資料段落提取與查詢工具 <small style="font-size:.55em;color:#64748b">V39.0 無 CDN 離線版</small></h1>
<div class="main" id="main">
<aside class="panel side"><div class="head"><h2>1. 載入與存取</h2><button class="collapse" id="collapse">‹ 收合</button></div><div class="side-body">
<input type="file" id="file-input" multiple accept=".pdf,.docx,.doc,.json,application/json"><input type="file" id="json-input" multiple accept=".json,application/json">
<div class="drop" id="drop" tabindex="0"><div class="drop-icon">⇧</div><strong>拖曳或點選匯入檔案</strong><div class="hint">支援多個 PDF、DOCX、JSON；DOC 請先另存 DOCX</div></div>
<div class="buttons"><button class="btn secondary" id="import-json">匯入 JSON</button><button class="btn primary" id="export-json">匯出 JSON</button><button class="btn success span2" id="export-xlsx">匯出 Excel（查詢結果）</button><button class="btn span2" id="clear">清除全部資料</button></div>
<div class="loader" id="loader"><div class="spinner"></div><p>處理中，請稍候...</p></div><div class="summary" id="summary">尚未載入資料</div><div class="quality" id="quality" hidden></div><div class="files" id="files"></div>
</div></aside>
<main class="panel">
<section class="batch" id="batch"><div class="batch-head"><div><h3>待處理檔案設定</h3><p id="pending-summary">請先上傳 PDF 或 DOCX。</p></div><span class="badge">僅套用本批檔案</span></div><div class="group"><label for="year-set">預算年度</label><select id="year-set"></select></div><div class="group"><label for="type-set">基金屬性</label><select id="type-set"><option>作業基金</option><option>政事基金</option></select></div><div class="group"><button class="btn primary" id="parse" style="width:100%">開始解析檔案</button></div><p class="note">匯入 JSON 時直接採用檔內年度與基金屬性。PDF 需含可選取文字，掃描影像不含 OCR。</p></section>
<nav class="tabs"><button class="tab active" data-tab="view">內容預覽</button><button class="tab" data-tab="search">階層式查詢</button></nav>
<section class="tab-pane active" id="view"><div class="toolbar"><div><h3>基金內容預覽</h3><p class="sub">選擇已載入基金以檢視結構化內容</p></div><div class="preview-select"><label for="fund-select">預覽基金</label><select id="fund-select"><option value="">請先載入資料</option></select></div></div><pre class="preview" id="preview">請先載入資料。</pre></section>
<section class="tab-pane" id="search"><div class="section-head"><div><h3>階層式查詢與關鍵字搜尋</h3><p class="sub">依年度、基金及標題逐層縮小範圍</p></div><button class="btn" id="reset">重設篩選</button></div>
<div class="filters"><div class="row"><div class="fg"><label>查詢年度</label><select id="fy"></select></div><div class="fg"><label>基金名稱</label><select id="ff"></select></div></div><div class="row"><div class="fg"><label>大標題</label><select id="fm"></select></div><div class="fg"><label>中標題</label><select id="fs"></select></div></div><div class="row keyword-row"><div class="fg small"><label>小標題</label><select id="fss"></select></div><div class="fg wide"><label>關鍵字</label><div class="keyword"><input id="kw" type="text" placeholder="搜尋標題與內容，可用空格輸入多個關鍵字"><button class="btn primary" id="search-btn">查詢</button></div></div></div></div>
<div class="result-info"><span id="result-count">0 筆結果</span><span>欄寬可拖曳調整</span></div><div class="table-wrap"><table id="table"><thead><tr><th style="width:8%">年度</th><th style="width:10%">屬性</th><th style="width:15%">基金名稱</th><th style="width:12%">大標題</th><th style="width:12%">中標題</th><th style="width:12%">小標題</th><th style="width:31%">分析說明內容</th></tr></thead><tbody id="tbody"><tr><td colspan="7">請先載入資料。</td></tr></tbody></table></div></section>
</main></div><div class="toast" id="toast" role="status"></div>
<script src="assets/vendor/pdf.min.js"></script>
<script src="assets/vendor/mammoth.browser.min.js"></script>
<script src="assets/vendor/xlsx.full.min.js"></script>
<script>
'use strict';
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='assets/vendor/pdf.worker.min.js';
const $=id=>document.getElementById(id), state={funds:[],pending:[],rows:[],meta:null};
const REGEX={作業基金:{main:/^(一、基金概況|二、(?:主要營運|最近\s*5\s*年主要營運項目)|三、本年度營運計畫及預算)/,sub:/^[\(（](?:一|二|三)[\)）](?:營運計畫主要內容|預算內容|補辦預算)/,ss:/^(?:1\.業務收支之預計|2\.餘絀撥補之預計|3\.現金流量之預計)/,two:/二、.*(?:主要營運|最近\s*5\s*年主要營運項目)/},政事基金:{main:/^(一、基金概況|二、(?:主要業務項目|最近\s*5\s*年主要業務項目|本年度業務計畫及預算)|三、本年度業務計畫及預算)/,sub:/^[\(（](?:一|二)[\)）](?:主要業務計畫|預算內容)/,ss:/^(?:1\.基金來源、用途及餘絀之預計|2\.現金流量之預計)/,two:/二、.*(?:主要業務項目|最近\s*5\s*年主要業務項目|本年度業務計畫及預算)/}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(m,e=false){const x=$('toast');x.textContent=m;x.className='toast show'+(e?' error':'');clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='toast',3200)}function busy(v){$('loader').style.display=v?'block':'none'}
function cleanTitle(t){return String(t||'').replace(/^[\(（][一二三四五六七八九十]+[\)）]|^[一二三四五六七八九十壹貳參肆伍陸柒捌玖拾]+、|^\d+\./,'').trim()}
function sourceLike(n){return /^(?:of|sf)?\d{2,3}[a-z]{0,3}[-_]/i.test(String(n||'').trim())||/\.(?:pdf|docx?|json)$/i.test(String(n||''))}
function text(v){if(v==null)return '';if(typeof v==='string')return v;if(typeof v==='number'||typeof v==='boolean')return String(v);try{return JSON.stringify(v)}catch{return String(v)}}
function normalize(f){f=(f&&typeof f==='object'&&!Array.isArray(f))?f:{};let n=text(f.fundName??f.name??f.fund_name).trim();const raw=f.structured??f.sections??f.items??f.paragraphs??[];const s=Array.isArray(raw)?raw.map(i=>{i=(i&&typeof i==='object')?i:{content:i};return {main:text(i.main??i.mainTitle??i.level1).trim(),sub:text(i.sub??i.subTitle??i.level2).trim(),subSub:text(i.subSub??i.subSubTitle??i.level3).trim(),content:text(i.content??i.text??i.description).trim()}}).filter(i=>i.main||i.sub||i.subSub||i.content):[];if(sourceLike(n)){const c=s.filter(i=>!i.main&&!i.sub&&!i.subSub).map(i=>i.content.replace(/\s+/g,'')).find(x=>x.length<=60&&/基金$/.test(x));if(c)n=c}return {...f,fundName:n||text(f.sourceFile??f.fileName??'未命名基金').replace(/\.(pdf|docx?|json)$/i,''),budgetYear:text(f.budgetYear??f.year??f.fiscalYear).trim(),fundType:text(f.fundType??f.type??'作業基金').trim()||'作業基金',sourceFile:text(f.sourceFile??f.fileName??f.importedFrom).trim(),structured:s,isDataSet:true}}
function key(f){return [f.budgetYear,f.fundType,f.fundName,f.sourceFile,JSON.stringify(f.structured)].join('||')}function merge(incoming){const m=new Map(state.funds.map(f=>[key(f),f]));let dup=0;incoming.map(normalize).forEach(f=>{const k=key(f);if(m.has(k))dup++;else m.set(k,f)});state.funds=[...m.values()];return dup}
function extractFundArray(p){if(Array.isArray(p))return p;if(!p||typeof p!=='object')return null;for(const k of ['funds','data','records','items'])if(Array.isArray(p[k]))return p[k];if(p.fundName||p.name||p.structured||p.sections)return [p];return null}
function parseJSONText(raw){let clean=String(raw??'').replace(/^\uFEFF/,'').trim();if(!clean)throw Error('檔案內容為空白');let p=JSON.parse(clean);if(typeof p==='string'){p=JSON.parse(p.replace(/^\uFEFF/,''))}return p}
function readJSON(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=e=>{try{const p=parseJSONText(e.target.result),a=extractFundArray(p);if(!a)throw Error('找不到可識別的基金資料陣列（支援 funds、data、records、items 或根陣列）');const valid=a.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)),skipped=a.length-valid.length;if(!valid.length)throw Error('資料陣列中沒有可匯入的基金物件');res({funds:valid.map(normalize),meta:Array.isArray(p)?null:p,skipped})}catch(x){rej(Error(file.name+'：'+x.message))}};r.onerror=()=>rej(Error(file.name+'：瀏覽器讀取失敗'));r.onabort=()=>rej(Error(file.name+'：讀取已取消'));r.readAsText(file,'UTF-8')})}
async function importJSON(files){files=[...files].filter(f=>/\.json$/i.test(f.name));if(!files.length)return toast('未選取 JSON 檔案',true);busy(true);try{const r=await Promise.allSettled(files.map(readJSON)),ok=r.filter(x=>x.status==='fulfilled'),bad=r.filter(x=>x.status==='rejected').map(x=>x.reason.message),incoming=ok.flatMap(x=>x.value.funds),skipped=ok.reduce((n,x)=>n+(x.value.skipped||0),0),dup=merge(incoming);if(ok[0]?.value.meta)state.meta=ok[0].value.meta;$('files').innerHTML=`<div class="file ok">✓ ${files.length} 個 JSON，讀入 ${incoming.length} 筆，略過 ${dup} 筆完全重複${skipped?`，略過 ${skipped} 筆無效項目`:''}。</div>`+(bad.length?`<div class="file warn">⚠ ${bad.map(esc).join('<br>')}</div>`:'');refresh();toast(bad.length?`匯入完成，但 ${bad.length} 個檔案失敗`:`成功匯入 ${incoming.length} 筆資料`,!!bad.length)}finally{busy(false)}}
function route(files){const a=[...files],j=a.filter(f=>/\.json$/i.test(f.name)),s=a.filter(f=>! /\.json$/i.test(f.name));if(j.length)importJSON(j);if(s.length)queue(s)}
function queue(files){const a=[...files],supported=a.filter(f=>/\.(pdf|docx)$/i.test(f.name)),docs=a.filter(f=>/\.doc$/i.test(f.name));state.pending=supported;$('files').innerHTML=supported.map(f=>`<div class="file">待處理：${esc(f.name)}</div>`).join('')+docs.map(f=>`<div class="file warn">無法處理：${esc(f.name)}（請另存 DOCX）</div>`).join('');$('batch').style.display=supported.length?'flex':'none';$('pending-summary').textContent=`本批次共 ${supported.length} 個 PDF／DOCX 待解析。`}
function extract(text,file,type,year){const rx=REGEX[type]||REGEX.作業基金,lines=String(text).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)throw Error('未擷取到文字');let name=file.name.replace(/\.(pdf|docx)$/i,''),start=0;for(let i=0;i<Math.min(lines.length,8);i++){const n=lines[i].replace(/\s/g,'');if(!rx.main.test(n)&&lines[i].includes('基金')){name=n;start=i+1;break}if(rx.main.test(n))break}let main='',sub='',ss='',buf=[],structured=[];const push=()=>{if(!main&&!sub&&!ss&&!buf.length)return;let content=buf.join('').replace(/\s/g,'');if(rx.two.test(main)&&!sub&&!ss)content='[表格內容，已於程式中略過]';else if(content)content=content.replace(/。/g,'。\n').trim();if(main||sub||ss||content)structured.push({main,sub,subSub:ss,content});buf=[]};for(let i=start;i<lines.length;i++){const line=lines[i],n=line.replace(/\s/g,'');if(rx.main.test(n)){push();main=line;sub='';ss=''}else if(rx.sub.test(n)){push();sub=line;ss=''}else if(rx.ss.test(n)){push();ss=line}else buf.push(line)}push();return normalize({fundName:name,budgetYear:year,fundType:type,sourceFile:file.name,structured})}
async function parsePDF(file,type,year){if(!window.pdfjsLib)throw Error('PDF.js 本機程式庫載入失敗，請確認 assets/vendor/pdf.min.js 已完整上傳');const bytes=new Uint8Array(await file.arrayBuffer());let pdf;try{pdf=await pdfjsLib.getDocument({data:bytes,cMapUrl:'assets/vendor/cmaps/',cMapPacked:true,standardFontDataUrl:'assets/vendor/standard_fonts/'}).promise}catch(first){try{pdf=await pdfjsLib.getDocument({data:bytes.slice(),disableWorker:true,cMapUrl:'assets/vendor/cmaps/',cMapPacked:true,standardFontDataUrl:'assets/vendor/standard_fonts/'}).promise}catch{throw Error('PDF 無法開啟：'+(first?.message||'格式損毀、加密或 Worker 載入失敗'))}}let all='';for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),tc=await page.getTextContent(),items=[...tc.items].sort((a,b)=>Math.abs(a.transform[5]-b.transform[5])>5?b.transform[5]-a.transform[5]:a.transform[4]-b.transform[4]);let txt='',last=null;for(const it of items){if(last!==null&&Math.abs(it.transform[5]-last)>5)txt+='\n';txt+=it.str;last=it.transform[5]}all+=txt+'\n'}if(!all.trim())throw Error('PDF 未擷取到文字，可能是掃描影像，請先執行 OCR');return extract(all,file,type,year)}
async function parseDOCX(file,type,year){if(!window.mammoth)throw Error('Mammoth 本機程式庫載入失敗，請確認 assets/vendor/mammoth.browser.min.js 已完整上傳');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return extract(r.value,file,type,year)}
function fill(select,items,current,label,clean=x=>x){const vals=[...new Set(items.map(String).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));select.innerHTML=`<option value="all">${esc(label)}</option>`;vals.forEach(v=>select.add(new Option(clean(v),v)));select.value=vals.includes(current)?current:'all'}
function flatten(){return state.funds.flatMap((f,fi)=>(f.structured||[]).map((i,ii)=>({f,i,fi,ii})))}
function updateFilters(){const sy=$('fy').value,sf=$('ff').value,sm=$('fm').value,ss=$('fs').value,sss=$('fss').value;fill($('fy'),state.funds.map(f=>f.budgetYear),sy,'所有年度');let a=state.funds;if(sy&&sy!=='all')a=a.filter(f=>f.budgetYear===sy);fill($('ff'),a.map(f=>f.fundName),sf,'所有基金');if(sf&&sf!=='all')a=a.filter(f=>f.fundName===sf);let x=a.flatMap(f=>f.structured);fill($('fm'),x.map(i=>i.main),sm,'所有大標題',cleanTitle);if(sm&&sm!=='all')x=x.filter(i=>i.main===sm);fill($('fs'),x.map(i=>i.sub),ss,'所有中標題',cleanTitle);if(ss&&ss!=='all')x=x.filter(i=>i.sub===ss);fill($('fss'),x.map(i=>i.subSub),sss,'所有小標題',cleanTitle);render()}
function render(){const vals={y:$('fy').value,f:$('ff').value,m:$('fm').value,s:$('fs').value,ss:$('fss').value},terms=$('kw').value.trim().toLocaleLowerCase('zh-TW').split(/\s+/).filter(Boolean);state.rows=flatten().filter(({f,i})=>(vals.y==='all'||f.budgetYear===vals.y)&&(vals.f==='all'||f.fundName===vals.f)&&(vals.m==='all'||i.main===vals.m)&&(vals.s==='all'||i.sub===vals.s)&&(vals.ss==='all'||i.subSub===vals.ss)&&i.content&&terms.every(t=>[i.main,i.sub,i.subSub,i.content].join('\n').toLocaleLowerCase('zh-TW').includes(t)));const body=$('tbody');if(!state.rows.length){body.innerHTML='<tr><td colspan="7">在此篩選條件下找不到結果。</td></tr>';$('result-count').textContent='0 筆結果';return}body.innerHTML=state.rows.map(({f,i})=>{let c=esc(i.content);terms.forEach(t=>{const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');c=c.replace(re,m=>`<mark class="highlight">${m}</mark>`)});return `<tr><td>${esc(f.budgetYear||'N/A')}</td><td>${esc(f.fundType)}</td><td>${esc(f.fundName)}</td><td>${esc(i.main)}</td><td>${esc(i.sub)}</td><td>${esc(i.subSub)}</td><td><pre>${c}</pre></td></tr>`}).join('');$('result-count').textContent=`${state.rows.length.toLocaleString()} 筆結果`}
function quality(){let omitted=0,empty=0,source=0;state.funds.forEach(f=>{if(sourceLike(f.fundName))source++;(f.structured||[]).forEach(i=>{if(i.content.includes('[表格內容，已於程式中略過]'))omitted++;if(!i.content)empty++})});const q=$('quality');q.hidden=!state.funds.length;q.innerHTML=state.funds.length?`<strong>資料品質提示</strong><br>略過表格 ${omitted} 段 · 空內容 ${empty} 段 · 疑似來源檔名 ${source} 筆`:''}
function refresh(){state.funds=state.funds.map(normalize);$('summary').innerHTML=state.funds.length?`<strong>${state.funds.length.toLocaleString()}</strong> 筆基金資料 · <strong>${new Set(state.funds.map(f=>f.budgetYear).filter(Boolean)).size}</strong> 個年度 · <strong>${new Set(state.funds.map(f=>f.fundType).filter(Boolean)).size}</strong> 種屬性`:'尚未載入資料';const s=$('fund-select');s.innerHTML='<option value="">--- 請選擇 ---</option>';state.funds.forEach((f,i)=>s.add(new Option(`[${f.budgetYear||'N/A'}] [${f.fundType}] ${f.fundName}`,String(i))));if(state.funds.length){s.value='0';preview(0)}else $('preview').textContent='請先載入資料。';quality();updateFilters()}
function preview(index){const f=state.funds[Number(index)];if(!f){$('preview').textContent='請選擇基金。';return}let t=`預算年度：${f.budgetYear||'N/A'}\n基金屬性：${f.fundType}\n基金名稱：${f.fundName}\n來源檔案：${f.sourceFile||'未記載'}\n\n--- 結構化內容 ---\n\n`;f.structured.forEach(i=>{if(i.main)t+=i.main+'\n';if(i.sub)t+='  '+i.sub+'\n';if(i.subSub)t+='    '+i.subSub+'\n';if(i.content)t+='      --> '+i.content.replace(/\n\s*/g,'\n          ')+'\n\n'});$('preview').textContent=t}
function exportJSON(){if(!state.funds.length)return toast('沒有資料可以匯出',true);const data={schemaVersion:'2.0',application:'基金資料段落提取與查詢工具',exportedAt:new Date().toISOString(),recordCount:state.funds.length,coverage:[...new Set(state.funds.map(f=>f.budgetYear).filter(Boolean))].sort(),funds:state.funds.map(({isDataSet,...f})=>f)};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`基金結構化資料庫_${new Date().toISOString().slice(0,10)}.json`)}function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function exportXLSX(){if(!state.rows.length)return toast('沒有查詢結果可以匯出',true);if(!window.XLSX)return toast('XLSX 程式庫載入失敗',true);const aoa=[['年度','屬性','基金名稱','大標題','中標題','小標題','分析說明內容'],...state.rows.map(({f,i})=>[f.budgetYear,f.fundType,f.fundName,i.main,i.sub,i.subSub,i.content])],ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[8,12,28,24,24,28,90].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'查詢結果');XLSX.writeFile(wb,`基金查詢結果_${new Date().toISOString().slice(0,10)}.xlsx`)}
function initYears(){const roc=new Date().getFullYear()-1911;$('year-set').innerHTML='';for(let y=roc+2;y>=roc-12;y--)$('year-set').add(new Option(`${y} 年度`,String(y)));$('year-set').value=String(roc)}
function resizable(){document.querySelectorAll('#table th').forEach((th,i,arr)=>{if(i===arr.length-1)return;const h=document.createElement('div');h.className='resize';th.style.position='sticky';h.onmousedown=e=>{e.preventDefault();const start=e.pageX,w=th.offsetWidth;const move=x=>th.style.width=Math.max(70,w+x.pageX-start)+'px';const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)};th.appendChild(h)})}
$('drop').onclick=()=>$('file-input').click();$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file-input').click()}};['dragenter','dragover'].forEach(x=>$('drop').addEventListener(x,e=>{e.preventDefault();$('drop').classList.add('over')}));['dragleave','drop'].forEach(x=>$('drop').addEventListener(x,e=>{e.preventDefault();$('drop').classList.remove('over')}));$('drop').ondrop=e=>route(e.dataTransfer.files);$('file-input').onchange=e=>{route(e.target.files);e.target.value=''};$('import-json').onclick=()=>$('json-input').click();$('json-input').onchange=e=>{importJSON(e.target.files);e.target.value=''};
$('parse').onclick=async()=>{if(!state.pending.length)return toast('沒有待處理檔案',true);busy(true);const type=$('type-set').value,year=$('year-set').value,results=[];$('files').innerHTML='';for(const file of state.pending){try{$('files').insertAdjacentHTML('beforeend',`<div class="file">處理中：${esc(file.name)}</div>`);results.push(/\.pdf$/i.test(file.name)?await parsePDF(file,type,year):await parseDOCX(file,type,year))}catch(e){$('files').insertAdjacentHTML('beforeend',`<div class="file warn">${esc(file.name)}：${esc(e.message)}</div>`)}}const dup=merge(results);state.pending=[];$('batch').style.display='none';busy(false);refresh();toast(`完成 ${results.length} 個檔案，略過 ${dup} 筆重複`,!results.length)};
$('fund-select').onchange=e=>preview(e.target.value);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.tab-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});['fy','ff','fm','fs','fss'].forEach(id=>$(id).onchange=updateFilters);$('search-btn').onclick=updateFilters;$('kw').onkeydown=e=>{if(e.key==='Enter')updateFilters()};$('reset').onclick=()=>{['fy','ff','fm','fs','fss'].forEach(id=>$(id).value='all');$('kw').value='';updateFilters();toast('已重設篩選條件')};$('export-json').onclick=exportJSON;$('export-xlsx').onclick=exportXLSX;$('clear').onclick=()=>{if(state.funds.length&&!confirm('確定清除全部資料？'))return;state.funds=[];state.pending=[];state.meta=null;$('files').innerHTML='';$('batch').style.display='none';refresh();toast('已清除全部資料')};$('collapse').onclick=()=>{const c=$('main').classList.toggle('closed');$('collapse').textContent=c?'展開 ›':'‹ 收合';try{localStorage.setItem('fundToolSidebarCollapsed',c?'1':'0')}catch{}};
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('程式錯誤：'+(e.message||'未知錯誤'),true)});window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('處理失敗：'+(e.reason?.message||e.reason||'未知錯誤'),true)});
initYears();try{if(localStorage.getItem('fundToolSidebarCollapsed')==='1')$('collapse').click()}catch{}resizable();refresh();
</script>
</body></html>
